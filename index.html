<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VP Optimizer - Valorant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #080d12; color: #e8eaed; font-family: 'Inter', sans-serif; }
    h1, h2, h3, .rajdhani { font-family: 'Rajdhani', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f1923; }
    ::-webkit-scrollbar-thumb { background: #ff4655; border-radius: 3px; }
    .tab-active { background: linear-gradient(135deg, #ff4655 0%, #c93040 100%); color: #fff; }
    .tab-inactive { background: #111b24; color: #8a9bb0; }
    .tab-inactive:hover { background: #1a2a38; color: #c0cdd9; }
    .card { background: #0f1923; border: 1px solid #1e2d3d; border-radius: 12px; }
    .card-winner-cheap { box-shadow: 0 0 24px rgba(34,197,94,0.12); border-color: #22c55e40 !important; }
    .card-winner-vp    { box-shadow: 0 0 24px rgba(27,207,160,0.12); border-color: #1bcfa040 !important; }

    /* Slider de orçamento com trilha unificada */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 20px;
      background-color: transparent;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      display: block;
      margin: 0;
      padding: 0;
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      background: transparent;
      border-radius: 999px;
      border: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff4655;
      cursor: pointer;
      border: 3px solid #080d12;
      box-shadow: 0 0 10px rgba(255,70,85,0.7);
      margin-top: -7px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(255,70,85,0.95);
    }
    input[type=range]::-webkit-slider-thumb:active {
      transform: scale(1.25);
      box-shadow: 0 0 18px rgba(255,70,85,1);
    }
    input[type=range]::-moz-range-track {
      height: 6px;
      background: transparent;
      border-radius: 999px;
      border: none;
    }
    input[type=range]::-moz-range-progress {
      height: 6px;
      background: transparent;
      border-radius: 999px;
      border: none;
    }
    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff4655;
      border: 3px solid #080d12;
      box-shadow: 0 0 10px rgba(255,70,85,0.7);
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    input[type=range]::-moz-range-thumb:hover {
      transform: scale(1.15);
    }

    .winner-badge {
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 3px 12px; border-radius: 99px; font-family: 'Rajdhani', sans-serif; white-space: nowrap;
    }
    .site-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      font-family: 'Rajdhani', sans-serif; text-transform: uppercase;
    }
    .glow-red { text-shadow: 0 0 20px rgba(255,70,85,0.4); }
    .shine { position: relative; }
    .shine-inner { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; pointer-events: none; z-index: 0; }
    .shine-inner::after {
      content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shine 3.5s infinite;
    }
    @keyframes shine { 0%{left:-100%} 60%,100%{left:200%} }
    .fade-in { animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .step-line { position: absolute; left: 13px; top: 28px; bottom: 0; width: 1px; background: #1e2d3d; }
    .coupon-row { transition: background 0.12s; border-radius: 8px; }
    .coupon-row:hover { background: #111b24; }
    .coupon-row-used { opacity: 0.62; }
    .coupon-row-used .coupon-strike { text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: #ff4655; }
    .coupon-submenu-overlay {
      position: fixed; inset: 0; z-index: 99990; background: rgba(3,7,12,0.72);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      display:flex; align-items:flex-start; justify-content:center; padding:72px 16px 24px;
    }
    .coupon-submenu-card {
      width:min(920px, calc(100vw - 32px)); max-height:calc(100vh - 96px);
      background:#0f1923; border:1px solid #2a3d4f; border-radius:14px;
      box-shadow:0 24px 70px rgba(0,0,0,.58); overflow:hidden; display:flex; flex-direction:column;
    }
    .coupon-submenu-head { padding:16px; border-bottom:1px solid #1e2d3d; background:#0c141d; }
    .coupon-submenu-list { overflow-y:auto; overscroll-behavior:contain; padding:0 16px 14px; }
    .coupon-submenu-row {
      display:grid;
      grid-template-columns:74px minmax(0,1fr) 34px 198px;
      align-items:center;
      gap:14px;
      padding:12px 2px;
    }
    .coupon-known-row {
      display:grid;
      grid-template-columns:74px minmax(0,1fr) 250px;
      align-items:center;
      gap:14px;
      padding:12px 2px;
    }
    .coupon-submenu-row + .coupon-submenu-row, .coupon-known-row + .coupon-known-row { border-top:1px solid #1e2d3d; }
    .coupon-store-cell { display:flex; align-items:center; justify-content:center; align-self:stretch; }
    .coupon-main-block { min-width:0; }
    .coupon-meta-line { display:flex; align-items:center; gap:10px; min-width:0; flex-wrap:wrap; }
    .coupon-code-pill { display:inline-flex; align-items:center; justify-content:center; min-width:112px; }
    .coupon-source-cell { display:flex; align-items:center; justify-content:flex-end; }
    .coupon-source-link { width:28px; height:28px; border-radius:8px; border:1px solid #1e2d3d; background:#111b24; color:#8a9bb0; display:inline-flex; align-items:center; justify-content:center; transition:.15s; }
    .coupon-source-link:hover { color:#fff; border-color:#ff4655; background:#182633; }
    .coupon-row-actions, .coupon-filter-actions { display:grid; grid-template-columns:104px 82px; gap:12px; align-items:center; justify-items:start; flex-shrink:0; }
    .coupon-known-actions { display:grid; grid-template-columns:78px 120px 34px; gap:9px; align-items:center; justify-items:start; flex-shrink:0; }
    .coupon-check-label { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:12px; color:#9ca3af; white-space:nowrap; }
    .coupon-check-box { width:16px; height:16px; border-radius:4px; border:2px solid #2a3d4f; background:#080d12; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; transition:.15s; }
    .coupon-check-label:hover .coupon-check-box { border-color:#ff4655aa; }
    .coupon-check-box.checked { background:#ff4655; border-color:#ff4655; }
    .coupon-check-label.disabled { opacity:.45; cursor:not-allowed; }
    .coupon-submenu-note { background:#111b24; border:1px solid #1e2d3d; border-radius:10px; }
    .coupon-store-filter { display:flex; gap:6px; flex-wrap:wrap; }
    @media (max-width: 767px) {
      .coupon-submenu-overlay { padding:10px 8px; align-items:flex-start; }
      .coupon-submenu-card { width:100%; max-height:calc(100dvh - 20px); }
      .coupon-row-actions, .coupon-filter-actions { grid-template-columns:1fr 1fr; width:100%; }
      .coupon-submenu-row {
        grid-template-columns:64px minmax(0,1fr) 34px;
        gap:10px;
        align-items:center;
      }
      .coupon-known-row {
        grid-template-columns:64px minmax(0,1fr);
        gap:10px;
        align-items:center;
      }
      .coupon-submenu-row .coupon-filter-actions { grid-column:1 / -1; }
      .coupon-known-row .coupon-known-actions { grid-column:1 / -1; width:100%; grid-template-columns:78px 1fr 34px; }
      .coupon-store-cell { align-self:center; }
      .coupon-meta-line { gap:8px; }
      .coupon-code-pill { min-width:0; justify-content:flex-start; }
    }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .btn-open-site {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 8px; font-size: 11px; font-weight: 600;
      font-family: 'Rajdhani', sans-serif; text-transform: uppercase;
      transition: all 0.15s; cursor: pointer; text-decoration: none; letter-spacing: 0.04em;
    }
    .btn-open-site:hover { opacity: 0.8; transform: translateY(-1px); }
    .tooltip-icon { width: 14px; height: 14px; border-radius: 99px; background: #1e2d3d;
      border: 1px solid #2a3d4f; color: #4a6070; font-size: 9px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: help; margin-left: 4px; flex-shrink: 0; font-family: 'Inter', sans-serif; }

    /* Esconde as setas de spinner nos inputs number */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }

    /* Input de desconto editável */
    .discount-input {
      width: 52px;
      background: #080d12;
      border: 1px solid #22c55e50;
      border-radius: 6px;
      padding: 2px 6px;
      color: #22c55e;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      font-family: 'Rajdhani', sans-serif;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .discount-input:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 2px rgba(34,197,94,0.15);
    }
    .discount-input:hover { border-color: #22c55e80; }

    /* Barra de entrada em overlay real durante a comparação */
    .floating-input-card {
      position: fixed !important;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 80rem;
      z-index: 1000;
      box-shadow: 0 18px 46px rgba(0,0,0,0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(15,25,35,0.96);
    }
    .results-scroll-target { scroll-margin-top: 16px; }
    .result-card { display: flex; flex-direction: column; min-height: 0; }
    .result-card-scroll { max-height: 260px; overflow-y: auto; padding-right: 4px; }
    .result-card-scroll-tight { max-height: 220px; overflow-y: auto; padding-right: 4px; }
    @media (max-width: 1279px) {
      .result-card-scroll { max-height: 240px; }
      .result-card-scroll-tight { max-height: 200px; }
    }
    @media (max-width: 767px) {
      .result-card-scroll, .result-card-scroll-tight { max-height: none; overflow: visible; padding-right: 0; }
      .floating-input-card {
        top: max(8px, env(safe-area-inset-top));
        width: calc(100% - 16px);
        max-height: calc(100dvh - 16px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .results-scroll-target { scroll-margin-top: 8px; }
      input, select, textarea { font-size: 16px !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useReducer } = React;

    /* ═══ DADOS E LOJAS ═══════════════════════════════════════ */
    const OFFICIAL_STORE = [
      { vp:475, price:18.90 }, { vp:1000, price:38.90 }, { vp:2050, price:75.90 },
      { vp:3650, price:132.90 }, { vp:5350, price:189.90 }, { vp:11000, price:379.90 },
    ];
    const NUUVEM_STORE = [
      { vp:400, bonus:0, price:16.00 }, { vp:805, bonus:10, price:32.00 },
      { vp:1610, bonus:90, price:64.00 }, { vp:2840, bonus:245, price:113.00 },
      { vp:4020, bonus:430, price:160.00 }, { vp:8040, bonus:1145, price:320.00 },
    ];
    const FALLBACK_RDC = [
      { vp:400, price:16.00, cashback:0.050 }, { vp:505, price:20.00, cashback:0.045 },
      { vp:815, price:32.00, cashback:0.050 }, { vp:1305, price:50.00, cashback:0.045 },
      { vp:1700, price:64.00, cashback:0.050 }, { vp:2720, price:100.00, cashback:0.045 },
      { vp:3085, price:113.00, cashback:0.050 }, { vp:4450, price:160.00, cashback:0.050 },
      { vp:4745, price:170.00, cashback:0.040 }, { vp:9185, price:320.00, cashback:0.050 },
    ];
    const BONOXS_STORE = [
      { vp:400, price:16.00 }, { vp:505, price:20.00 },
      { vp:815, price:32.00 }, { vp:1305, price:50.00 },
      { vp:1700, price:64.00 }, { vp:2720, price:100.00 },
      { vp:3085, price:113.00 }, { vp:4450, price:160.00 },
      { vp:4745, price:170.00 }, { vp:9185, price:320.00 },
    ];

    const FALLBACK_AURORA = [
      { vp:400,  price:14.88, cashback:0.01, pix:true },
      { vp:815,  price:29.76, cashback:0.01, pix:true },
      { vp:1700, price:59.52, cashback:0.01, pix:true },
      { vp:3085, price:105.09, cashback:0.01, pix:true },
      { vp:4450, price:148.80, cashback:0.01, pix:true },
      { vp:9185, price:297.60, cashback:0.01, pix:true },
    ];

    const SITES = {
      official: { label:'Loja Oficial',  color:'#4fa3e0', tag:'RIOT',   url:null,                                                store:OFFICIAL_STORE },
      nuuvem:   { label:'Nuuvem',        color:'#1bcfa0', tag:'NUUVEM', url:'https://www.nuuvem.com/lp/pt/valorant-points/',    store:NUUVEM_STORE   },
      rdc:      { label:'Rei dos Coins', color:'#f5a623', tag:'RDC',    url:'https://www.reidoscoins.com.br/Valorant',          store:null           },
      bonoxs:   { label:'Bonoxs',        color:'#a855f7', tag:'BONOXS', url:'https://bonoxs.com/br?from=header',                store:BONOXS_STORE   },
      aurora:   { label:'Aurora Gamer',  color:'#e879f9', tag:'AURORA', url:'https://auroragamer.com.br/category/valorant',       store:null, pixOnly:true, cashback:0.01 },
    };

    /* ═══ FETCH RDC ═══════════════════════════════════════════ */
    const CORS_PROXIES = [
      (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
      (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    ];
    const parseRdcHtml = (html) => {
      const text = new DOMParser().parseFromString(html,'text/html').body.textContent||'';
      const re = /Valorant\s+(\d[\d.]*)\s+VPoints[\s\S]{0,300}?R\$\s*(\d+(?:[.,]\d{2})?)[\s\S]{0,200}?([\d]+(?:[.,]\d+)?)\s*%\s*de\s*Cashback/gi;
      const map = new Map();
      for (const m of text.matchAll(re)) {
        const vp=parseInt(m[1].replace('.',''));
        const price=parseFloat(m[2].replace('.','').replace(',','.'));
        const cashback=parseFloat(m[3].replace(',','.'))/100;
        if(vp>0&&price>0&&!isNaN(cashback)) map.set(vp,{vp,price,cashback});
      }
      return [...map.values()].sort((a,b)=>a.vp-b.vp);
    };
    const RDC_CACHE_KEY = 'vp_optimizer_rdc_cache';
    function loadCachedRdc(){
      try{
        const raw=localStorage.getItem(RDC_CACHE_KEY);
        if(!raw) return null;
        const {data,ts}=JSON.parse(raw);
        if(Array.isArray(data)&&data.length>0) return data;
      }catch(e){}
      return null;
    }
    function saveCachedRdc(data){
      try{ localStorage.setItem(RDC_CACHE_KEY,JSON.stringify({data,ts:Date.now()})); }catch(e){}
    }

    async function fetchRdc() {
      for (let i=0;i<CORS_PROXIES.length;i++) {
        try {
          const r=await fetch(CORS_PROXIES[i]('https://www.reidoscoins.com.br/Valorant'),{signal:AbortSignal.timeout(8000)});
          if(!r.ok) continue;
          const html=i===0?(await r.json()).contents:await r.text();
          if(!html) continue;
          const parsed=parseRdcHtml(html);
          if(parsed.length>0){
            saveCachedRdc(parsed);
            return{data:parsed,source:'live'};
          }
        } catch(e) { console.warn(`Proxy ${i}:`,e.message); }
      }
      const cached=loadCachedRdc();
      if(cached) return{data:cached,source:'cache'};
      return{data:FALLBACK_RDC,source:'fallback'};
    }

    /* ═══ FETCH AURORA GAMER ══════════════════════════════════ */
    const AURORA_URL = 'https://auroragamer.com.br/category/valorant';
    const AURORA_CACHE_KEY = 'vp_optimizer_aurora_cache';

    const parseAuroraHtml = (html) => {
      const text = new DOMParser().parseFromString(html,'text/html').body.textContent || '';
      const re = /Valorant\s*-\s*(\d[\d.]*)\s*VP[\s\S]{0,260}?R\$\s*(\d+(?:[.,]\d{2})?)[\s\S]{0,140}?R\$\s*(\d+(?:[.,]\d{2})?)[\s\S]{0,100}?(?:à|a)\s+vista\s+no\s+Pix/gi;
      const map = new Map();
      for (const m of text.matchAll(re)) {
        const vp = parseInt(m[1].replace(/\./g,''));
        const regularPrice = parseFloat(m[2].replace(/\./g,'').replace(',','.'));
        const pixPrice = parseFloat(m[3].replace(/\./g,'').replace(',','.'));
        if(vp>0 && pixPrice>0){
          map.set(vp,{vp,price:pixPrice,regularPrice,cashback:0.01,pix:true});
        }
      }
      return [...map.values()].sort((a,b)=>a.vp-b.vp);
    };

    function loadCachedAurora(){
      try{
        const raw=localStorage.getItem(AURORA_CACHE_KEY);
        if(!raw) return null;
        const {data}=JSON.parse(raw);
        if(Array.isArray(data)&&data.length>0) return data;
      }catch(e){}
      return null;
    }
    function saveCachedAurora(data){
      try{ localStorage.setItem(AURORA_CACHE_KEY,JSON.stringify({data,ts:Date.now()})); }catch(e){}
    }

    async function fetchAuroraCashbackRate(){
      const verifyUrl='https://auroragamer.com.br/package/valorant-1700-vp';
      for(let i=0;i<CORS_PROXIES.length;i++){
        try{
          const r=await fetch(CORS_PROXIES[i](verifyUrl),{signal:AbortSignal.timeout(8000)});
          if(!r.ok) continue;
          const html=i===0?(await r.json()).contents:await r.text();
          const text=new DOMParser().parseFromString(html||'','text/html').body.textContent||'';
          const m=text.match(/([\d]+(?:[.,]\d+)?)\s*%\s*de\s*volta\s*para\s*usar\s*na\s*pr[oó]xima/i);
          if(m) return parseFloat(m[1].replace(',','.'))/100;
        }catch(e){ console.warn(`Aurora cashback proxy ${i}:`,e.message); }
      }
      return 0.01;
    }

    async function fetchAurora() {
      for (let i=0;i<CORS_PROXIES.length;i++) {
        try {
          const r=await fetch(CORS_PROXIES[i](AURORA_URL),{signal:AbortSignal.timeout(8000)});
          if(!r.ok) continue;
          const html=i===0?(await r.json()).contents:await r.text();
          if(!html) continue;
          const parsed=parseAuroraHtml(html);
          if(parsed.length>0){
            const cashback=await fetchAuroraCashbackRate();
            const verified=parsed.map(item=>({...item,cashback}));
            saveCachedAurora(verified);
            return{data:verified,source:'live',cashback};
          }
        } catch(e) { console.warn(`Aurora proxy ${i}:`,e.message); }
      }
      const cached=loadCachedAurora();
      if(cached) return{data:cached,source:'cache',cashback:cached[0]?.cashback||0.01};
      return{data:FALLBACK_AURORA,source:'fallback',cashback:0.01};
    }

    /* ═══ CUPONS AUTOMÁTICOS: SOMENTE SCRAPING ══════════════ */
    const NUUVEM_COUPONS_URL = 'https://www.nuuvem.com/br-pt/log-cupom-interno';
    const COUPERT_RDC_URL = 'https://www.coupert.com/shop/reidoscoins.com.br';
    const PROMOCODIE_BONOXS_URL = 'https://br.promocodie.com/cupom-e-gifts-bazaar';

    const normalizeSpaces = (value='') => value.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();

    // Cache somente do ultimo scraping valido. Nao contem cupons manuais/fixos.
    const SCRAPED_COUPON_CACHE_PREFIX='vp_optimizer_scraped_coupon_cache_v1_';
    const SCRAPED_COUPON_CACHE_MAX_AGE=72*60*60*1000;
    function scrapedCouponCacheKey(label){
      return SCRAPED_COUPON_CACHE_PREFIX+String(label||'source').toLowerCase().replace(/[^a-z0-9]+/g,'_');
    }
    function saveScrapedCouponCache(label,parsed,url){
      if(!Array.isArray(parsed)||parsed.length===0) return;
      try{
        localStorage.setItem(scrapedCouponCacheKey(label),JSON.stringify({ts:Date.now(),url,parsed}));
      }catch(e){}
    }
    function loadScrapedCouponCache(label){
      try{
        const raw=localStorage.getItem(scrapedCouponCacheKey(label));
        if(!raw) return null;
        const data=JSON.parse(raw);
        if(!Array.isArray(data?.parsed)||data.parsed.length===0) return null;
        const age=Date.now()-Number(data.ts||0);
        if(!Number.isFinite(age)||age<0||age>SCRAPED_COUPON_CACHE_MAX_AGE) return null;
        return {...data,age};
      }catch(e){ return null; }
    }

    async function fetchHtmlThroughProxy(url,label,parser=null){
      const httpTarget=url.replace(/^https:\/\//i,'http://');
      const transports=[
        {
          name:'Reader texto',
          url:`https://r.jina.ai/${url}`,
          options:{signal:AbortSignal.timeout(15000)},
          decode:async r=>await r.text()
        },
        {
          name:'Reader texto HTTP',
          url:`https://r.jina.ai/${httpTarget}`,
          options:{signal:AbortSignal.timeout(15000)},
          decode:async r=>await r.text()
        },
        {
          name:'CodeTabs',
          url:`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
          options:{signal:AbortSignal.timeout(12000)},
          decode:async r=>await r.text()
        },
        {
          name:'IsomorphicGit CORS',
          url:`https://cors.isomorphic-git.org/${url}`,
          options:{signal:AbortSignal.timeout(12000)},
          decode:async r=>await r.text()
        },
        {
          name:'AllOrigins raw',
          url:`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
          options:{signal:AbortSignal.timeout(10000)},
          decode:async r=>await r.text()
        },
        {
          name:'AllOrigins',
          url:`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
          options:{signal:AbortSignal.timeout(10000)},
          decode:async r=>(await r.json()).contents||''
        },
        {
          name:'CorsProxy',
          url:`https://corsproxy.io/?${encodeURIComponent(url)}`,
          options:{signal:AbortSignal.timeout(10000)},
          decode:async r=>await r.text()
        }
      ];

      const cached=parser?loadScrapedCouponCache(label):null;
      for(let idx=0;idx<transports.length;idx++){
        const t=transports[idx];
        try{
          const r=await fetch(t.url,t.options);
          if(!r.ok) throw new Error(`HTTP ${r.status}`);
          const body=await t.decode(r);
          if(!body || body.length<=100) throw new Error('Resposta vazia');
          const head=body.slice(0,7000);
          if(/just a moment|checking your browser|access denied|cf-chl-|captcha|verify you are human/i.test(head) && body.length<20000) throw new Error('Pagina de bloqueio');
          if(parser){
            const parsed=parser(body);
            if(!Array.isArray(parsed) || parsed.length===0){
              console.warn(`${label} ${t.name}: pagina carregou, mas nenhum cupom compativel foi extraido.`);
              continue;
            }
            saveScrapedCouponCache(label,parsed,url);
            console.info(`${label}: ${parsed.length} cupom(ns) via ${t.name} (${body.length} bytes)`);
            return {body,parsed,transport:t.name,cached:false};
          }
          console.info(`${label}: carregado via ${t.name} (${body.length} bytes)`);
          return body;
        }catch(e){
          console.warn(`${label} ${t.name}:`,e.message);
          if(idx===0 && cached){
            console.warn(`${label}: usando ${cached.parsed.length} cupom(ns) do ultimo scraping valido (${Math.round(cached.age/60000)} min atras).`);
            return {body:null,parsed:cached.parsed,transport:'cache do scraping',cached:true};
          }
        }
      }
      if(cached){
        console.warn(`${label}: nenhuma rota respondeu; usando ${cached.parsed.length} cupom(ns) do ultimo scraping valido.`);
        return {body:null,parsed:cached.parsed,transport:'cache do scraping',cached:true};
      }
      console.warn(`${label}: nenhuma rota de scraping retornou cupons validos e nao ha cache de scraping recente.`);
      return parser?{body:null,parsed:[],transport:null,cached:false}:null;
    }

    function contentToText(content){
      if(!content) return '';
      const doc=new DOMParser().parseFromString(content,'text/html');
      return normalizeSpaces(doc.body?.textContent||content)
        .replace(/\\\[/g,'[').replace(/\\\]/g,']');
    }

    function parseNuuvemCoupons(content){
      const raw=String(content||'').replace(/\r/g,'');
      const text=contentToText(content);
      const map=new Map();
      const invalid=new Set(['RIOT','VALORANT','PIX','OFF','CUPOM','CODIGO','CÓDIGO','NUUVEM','CASHBACK','VER','COPIAR']);

      const add=(code,desc='')=>{
        code=normalizeSpaces(code||'').replace(/[*_`#]/g,'').toUpperCase();
        desc=normalizeSpaces(desc||'');
        if(!/^[A-Z0-9-]{3,30}$/.test(code)||invalid.has(code)) return;
        if(!/(?:\briot\b|\bvalorant\b)/i.test(desc)) return;
        const pct=desc.match(/([0-9]+(?:[.,][0-9]+)?)\s*%/i);
        const value=pct?parseFloat(pct[1].replace(',','.')):null;
        map.set(code,{
          code,value,
          desc:desc||'Cupom para produtos Riot/Valorant.',
          method:/\bpix\b/i.test(desc)?'Pagamento via Pix':'',
          confidence:'alta',source:'Nuuvem',sourceUrl:NUUVEM_COUPONS_URL,
          scope:'Riot/Valorant',scraped:true
        });
      };

      const lines=raw.split('\n').map(x=>normalizeSpaces(x.replace(/^\s*#+\s*/,''))).filter(Boolean);
      for(let i=0;i<lines.length;i++){
        const m=lines[i].match(/^(?:Cupom|C[oó]digo|Coupon)\s*:\s*([A-Z0-9-]{3,30})\b/i);
        if(!m) continue;
        const block=[];
        for(let j=i+1;j<Math.min(lines.length,i+9);j++){
          if(/^(?:Cupom|C[oó]digo|Coupon)\s*:/i.test(lines[j])) break;
          block.push(lines[j]);
        }
        add(m[1],block.join(' '));
      }

      if(map.size===0){
        const re=/(?:Cupom|C[oó]digo|Coupon)\s*:\s*([A-Z0-9-]{3,30})\b([\s\S]{0,650}?)(?=(?:Cupom|C[oó]digo|Coupon)\s*:|$)/gi;
        for(const m of text.matchAll(re)) add(m[1],m[2]);
      }

      return [...map.values()];
    }

    function parseCoupertRdcCoupons(content){
      const raw=String(content||'').replace(/\r/g,'');
      const doc=new DOMParser().parseFromString(raw,'text/html');
      const codes=new Set();
      const invalid=new Set([
        'CODE','COUPON','COUPERT','COPY','GET','GETCODE','PROMO','AVAILABLE','DISCOUNT',
        'REIDOSCOINS','REI','DOS','COINS','LIST','LISTA','LIST_REIDOSCOINS','OBTER','CODIGO','CÓDIGO',
        'SHOP','SITE','SAVE','DEAL','DEALS','SALE','COUPONS','CUPONS','OFFERS','OFERTAS',
        'LOGIN','SIGNUP','HOME','BRASIL','BRAZIL','CLICK','BUTTON','COPYCODE','COUPONCODE','PROMOCODE',
        'IMAGE','VECTOR','MORE','INFORMATION','ABOUT','PURCHASE','EXTRA','YOUR','ON','THE','AND'
      ]);

      const addCode=(rawCode)=>{
        const candidate=normalizeSpaces(String(rawCode||'').replace(/[`*_#]/g,''))
          .replace(/^[^A-Z0-9]+|[^A-Z0-9-]+$/gi,'')
          .toUpperCase();
        if(!/^[A-Z0-9-]{4,24}$/.test(candidate)) return false;
        if(invalid.has(candidate)) return false;
        if(candidate.includes('_')) return false;
        if(/^\d+$/.test(candidate)) return false;
        if(/^(?:HTTP|HTTPS|WWW|COM|HTML|CLASS|BUTTON|DIV|SPAN)/.test(candidate)) return false;
        codes.add(candidate);
        return true;
      };

      doc.querySelectorAll('[class*="CodeButton_realCopyButton"]').forEach(button=>{
        const codeEl=button.querySelector('[class*="CodeButton_code__"]');
        if(codeEl) addCode(codeEl.textContent);
      });
      if(codes.size===0){
        doc.querySelectorAll('[class*="CodeButton_code__"]').forEach(el=>addCode(el.textContent));
      }

      if(codes.size===0){
        const lines=raw.split('\n').map(line=>normalizeSpaces(
          line
            .replace(/!\[[^\]]*\]\([^)]*\)/g,' ')
            .replace(/\[[^\]]*\]\([^)]*\)/g,' ')
            .replace(/^\s*#{1,6}\s*/,'')
            .replace(/[`*_]/g,' ')
        )).filter(Boolean);

        let sectionStart=lines.findIndex(line=>/\bAvailable\s+Coupons?\b/i.test(line));
        if(sectionStart<0) sectionStart=0;
        let sectionEnd=lines.findIndex((line,idx)=>idx>sectionStart && /More\s+Information\s+about\s+rei\s+dos\s+coins/i.test(line));
        if(sectionEnd<0) sectionEnd=Math.min(lines.length,sectionStart+80);
        const section=lines.slice(sectionStart,sectionEnd);

        for(let i=0;i<section.length;i++){
          if(!/^(?:Get\s+Code|Obter\s+(?:o\s+)?c[oó]digo)(?:\b|\s|:|-)/i.test(section[i])) continue;
          for(let j=i+1;j<Math.min(section.length,i+7);j++){
            const line=section[j];
            if(/^(?:More\s+Information|CODE|Coupon|Cupom|Get\s+Code|Obter\s+c[oó]digo)$/i.test(line)) continue;
            const direct=line.match(/^([A-Z0-9-]{4,24})$/i);
            if(direct && addCode(direct[1])) break;
          }
        }
      }

      if(codes.size===0){
        const flat=raw
          .replace(/!\[[^\]]*\]\([^)]*\)/g,' ')
          .replace(/\[[^\]]*\]\([^)]*\)/g,' ')
          .replace(/[`*_#]/g,' ')
          .replace(/\s+/g,' ');
        const couponArea=(flat.match(/Available\s+Coupons?[\s\S]*?(?=More\s+Information\s+about\s+rei\s+dos\s+coins|$)/i)||[])[0]||'';
        const re=/(?:Get\s+Code|Obter\s+(?:o\s+)?c[oó]digo)[^A-Z0-9-]{0,80}([A-Z0-9-]{4,24})(?=\s|$)/gi;
        for(const m of couponArea.matchAll(re)) addCode(m[1]);
      }

      return [...codes].map(code=>({
        code,value:null,
        desc:'Cupom encontrado automaticamente na Coupert. A fonte não informa o percentual de desconto.',
        method:'Desconto a verificar',confidence:'média',source:'Coupert',sourceUrl:COUPERT_RDC_URL,scraped:true
      }));
    }

    function parsePromocodieBonoxsCoupons(content){
      const doc=new DOMParser().parseFromString(content||'','text/html');
      const text=contentToText(content);
      const map=new Map();
      const invalid=new Set(['CODIGO','CÓDIGO','CUPOM','PEGAR','OFERTA','OFF','BONOXS','GIFTS','BAZAAR']);

      doc.querySelectorAll('.right-box').forEach(card=>{
        const type=normalizeSpaces(card.querySelector('.coupon-tag-code')?.textContent||'');
        const title=normalizeSpaces(card.querySelector('.merchat-coupon-title')?.textContent||'');
        const code=normalizeSpaces(card.querySelector('.text-code')?.textContent||'').toUpperCase();
        if(!code||!/^c[oó]digo$/i.test(type)||!/^[A-Z0-9_-]{3,40}$/.test(code)) return;
        const pctMatch=title.match(/([0-9]+(?:[.,][0-9]+)?)\s*%/i);
        const value=pctMatch?parseFloat(pctMatch[1].replace(',','.')):null;
        map.set(code,{code,value:Number.isFinite(value)?value:null,desc:title||'Cupom encontrado automaticamente na Promocodie.',method:'',confidence:'média',source:'Promocodie',sourceUrl:PROMOCODIE_BONOXS_URL,scraped:true});
      });

      const re=/([0-9]+(?:[.,][0-9]+)?)\s*%\s*OFF[\s\S]{0,100}?C[oó]digo([\s\S]{0,700}?)(?:Pegar\s+Cupom)\s*([A-Z0-9_-]{3,40})/gi;
      for(const m of text.matchAll(re)){
        const value=parseFloat(m[1].replace(',','.'));
        const middle=normalizeSpaces(m[2]);
        const code=(m[3]||'').toUpperCase();
        if(!code||invalid.has(code)) continue;
        const title=(middle.match(/(?:###\s*)?([^#]{8,260})$/)||[])[1]||middle;
        map.set(code,{code,value:Number.isFinite(value)?value:null,desc:normalizeSpaces(title).slice(0,280)||'Cupom encontrado automaticamente na Promocodie.',method:'',confidence:'média',source:'Promocodie',sourceUrl:PROMOCODIE_BONOXS_URL,scraped:true});
      }

      if(map.size===0){
        const starts=[...text.matchAll(/([0-9]+(?:[.,][0-9]+)?)\s*%\s*OFF/gi)];
        for(let i=0;i<starts.length;i++){
          const m=starts[i];
          const block=text.slice(m.index,Math.min(text.length,starts[i+1]?.index??m.index+1000));
          if(!/\bC[oó]digo\b/i.test(block)) continue;
          const c=block.match(/Pegar\s+Cupom\s*([A-Z0-9_-]{3,40})/i);
          const code=(c?.[1]||'').toUpperCase();
          if(!code||invalid.has(code)) continue;
          const value=parseFloat(m[1].replace(',','.'));
          const desc=normalizeSpaces(block.replace(/^.*?OFF/i,'').replace(/Pegar\s+Cupom[\s\S]*$/i,'')).slice(0,280);
          map.set(code,{code,value,desc:desc||'Cupom encontrado automaticamente na Promocodie.',method:'',confidence:'média',source:'Promocodie',sourceUrl:PROMOCODIE_BONOXS_URL,scraped:true});
        }
      }
      return [...map.values()];
    }

    async function fetchAutoCoupons(){
      const [nuuvemResult,rdcResult,bonoxsResult]=await Promise.all([
        fetchHtmlThroughProxy(NUUVEM_COUPONS_URL,'Nuuvem',parseNuuvemCoupons),
        fetchHtmlThroughProxy(COUPERT_RDC_URL,'Coupert',parseCoupertRdcCoupons),
        fetchHtmlThroughProxy(PROMOCODIE_BONOXS_URL,'Promocodie',parsePromocodieBonoxsCoupons)
      ]);

      const result={
        official:[],
        nuuvem:nuuvemResult?.parsed||[],
        rdc:rdcResult?.parsed||[],
        bonoxs:bonoxsResult?.parsed||[],
        aurora:[]
      };
      console.info('Cupons via scraping:',{
        nuuvem:result.nuuvem.length,
        rdc:result.rdc.length,
        bonoxs:result.bonoxs.length
      });
      return result;
    }

    const hasCouponValue = (v) => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
    const USED_COUPONS_KEY = 'vp_optimizer_used_coupons';
    const couponKey = (site,code) => `${site}::${String(code||'').trim().toUpperCase()}`;
    const isCouponUsed = (usedCoupons,site,code) => (usedCoupons||[]).includes(couponKey(site,code));
    const loadUsedCoupons = () => {
      try {
        const raw=JSON.parse(localStorage.getItem(USED_COUPONS_KEY)||'[]');
        return Array.isArray(raw)?raw:[];
      } catch(e) { return []; }
    };
    const saveUsedCoupons = (items) => {
      try { localStorage.setItem(USED_COUPONS_KEY,JSON.stringify(items||[])); } catch(e) {}
    };
    function getBestAvailableCoupon(knownCoupons,site,usedCoupons){
      return (knownCoupons?.[site]||[])
        .filter(c=>hasCouponValue(c.value) && Number(c.value)>0 && !isCouponUsed(usedCoupons,site,c.code))
        .sort((a,b)=>Number(b.value)-Number(a.value))[0] || null;
    }
    function buildDefaultCouponSelection(knownCoupons,usedCoupons){
      const selected={};
      Object.entries(knownCoupons||{}).forEach(([site,coupons])=>{
        (coupons||[]).forEach(c=>{
          if(!isCouponUsed(usedCoupons,site,c.code)) selected[couponKey(site,c.code)] = true;
        });
      });
      return selected;
    }
    function isCouponSelected(selection,site,code){
      return !!(selection && selection[couponKey(site,code)]);
    }
    function getBestSelectedCoupon(knownCoupons,site,usedCoupons,selection,overrides={}){
      return (knownCoupons?.[site]||[])
        .filter(c=>!isCouponUsed(usedCoupons,site,c.code) && isCouponSelected(selection,site,c.code))
        .map(c=>{
          const key=couponKey(site,c.code);
          const value=hasCouponValue(c.value) && Number(c.value)>0 ? Number(c.value) : Number(overrides?.[key]||0);
          return {...c,value};
        })
        .filter(c=>Number(c.value)>0)
        .sort((a,b)=>Number(b.value)-Number(a.value))[0] || null;
    }

    /* ═══ HELPERS ═════════════════════════════════════════════ */
    const fmt  = (v) => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
    const fmtN = (v) => new Intl.NumberFormat('pt-BR').format(v);

    function getCombos(store,maxLen=4){
      const res=[];
      const h=(c,s)=>{
        if(c.length>0)res.push([...c]);
        if(c.length===maxLen)return;
        for(let i=s;i<store.length;i++){c.push(store[i]);h(c,i);c.pop();}
      };
      h([],0); return res;
    }
    function evalCombo(combo,applyCb,cpPct=0){
      const sorted=[...combo].sort((a,b)=>b.price-a.price);
      let cost=0, originalTotalCost=0, cb=0, steps=[],totalVP=0;

      for(const item of sorted){
        const tvp=item.vp+(item.bonus||0); totalVP+=tvp;
        originalTotalCost += item.price;

        if(applyCb){
          const paid=Math.max(0,item.price-cb)*(1-cpPct/100);
          const earned=paid*(item.cashback||0);
          cost+=paid;
          steps.push({...item,totalVpNow:tvp,discountUsed:cb,paid,originalPrice:item.price,cashbackEarned:earned});
          cb=earned;
        } else {
          const paid=item.price*(1-cpPct/100);
          cost+=paid;
          steps.push({...item,totalVpNow:tvp,discountUsed:0,paid,originalPrice:item.price,cashbackEarned:0});
          cb=0;
        }
      }
      return{items:sorted,totalVP,totalCost:cost,originalCost:originalTotalCost,steps,finalCashback:cb};
    }
    function findBestFor(store,need,applyCb=false,cpPct=0){
      if(!store||!store.length)return null;
      let best=null;
      for(const c of getCombos(store,4)){
        const ev=evalCombo(c,applyCb,cpPct);
        if(ev.totalVP>=need&&(!best||ev.totalCost<best.totalCost||(ev.totalCost===best.totalCost&&ev.totalVP>best.totalVP)))best=ev;
      }
      return best;
    }
    function findMaxVPFor(store,budget,applyCb=false,cpPct=0){
      if(!store||!store.length)return null;
      let best=null;
      for(const c of getCombos(store,4)){
        const ev=evalCombo(c,applyCb,cpPct);
        if(ev.totalCost<=budget+0.001&&(!best||ev.totalVP>best.totalVP||(ev.totalVP===best.totalVP&&ev.totalCost<best.totalCost)))best=ev;
      }
      return best;
    }

    /* ═══ TOOLTIP ═════════════════════════════════════════════ */
    function Tooltip({text}){
      const [pos,setPos]=useState(null);
      const ref=React.useRef(null);
      const show=()=>{
        if(!ref.current)return;
        const r=ref.current.getBoundingClientRect();
        const x=Math.min(Math.max(r.left+r.width/2,126),window.innerWidth-126);
        setPos({x,y:r.top});
      };
      const hide=()=>setPos(null);
      return(
        <span ref={ref} className="tooltip-icon" onMouseEnter={show} onMouseLeave={hide} onClick={e=>e.preventDefault()}>?
          {pos&&ReactDOM.createPortal(
            <div style={{
              position:'fixed',bottom:`${window.innerHeight-pos.y+10}px`,left:`${pos.x}px`,
              transform:'translateX(-50%)',background:'#111b24',border:'1px solid #2a3d4f',
              borderRadius:10,padding:'10px 13px',width:240,fontSize:12,color:'#c0cdd9',
              lineHeight:1.5,zIndex:99999,pointerEvents:'none',
              boxShadow:'0 8px 24px rgba(0,0,0,0.5)',fontFamily:'Inter',fontWeight:400,
            }}>
              {text}
              <div style={{position:'absolute',top:'100%',left:'50%',transform:'translateX(-50%)',
                border:'6px solid transparent',borderTopColor:'#2a3d4f'}}/>
            </div>,
            document.body
          )}
        </span>
      );
    }

    /* ═══ TESTADOR DE CUPOM UNIFICADO ═════════════════════════ */
    function UnifiedCouponTester({ moduleKey, state, dispatch, knownCoupons, usedCoupons }) {
      const isCouponsTab = moduleKey === 'coupons';
      const localState   = state[moduleKey];

      const siteKey   = isCouponsTab ? 'testSite'   : 'couponSite';
      const codeKey   = isCouponsTab ? 'testCode'   : 'couponCode';
      const statusKey = isCouponsTab ? 'testResult' : 'couponStatus';

      const site      = localState[siteKey];
      const code      = localState[codeKey];
      const status    = localState[statusKey];
      const couponPct = !isCouponsTab ? (localState.couponPct || 0) : 0;

      const setVal = (f, v) => dispatch({ type: moduleKey.toUpperCase(), field: f, val: v });

      const handleTest = async () => {
        if (!code.trim() || !site) {
          setVal(statusKey, null);
          if (!isCouponsTab) setVal('couponPct', 0);
          return;
        }

        const normalizedCode = code.trim().toUpperCase();
        let found = null;

        if (isCouponsTab && site === 'all') {
          for (const [couponSite, coupons] of Object.entries(knownCoupons)) {
            const match = (coupons || []).find(c => c.code.toUpperCase() === normalizedCode);
            if (match) {
              found = { ...match, site: couponSite };
              break;
            }
          }
        } else {
          const couponsList = knownCoupons[site] || [];
          const match = couponsList.find(c => c.code.toUpperCase() === normalizedCode);
          if (match) found = { ...match, site };
        }

        if (!found) {
          setVal(statusKey, { valid: false, notInBase: true, code: normalizedCode, site });
          if (!isCouponsTab) setVal('couponPct', 0);
          return;
        }

        if (isCouponUsed(usedCoupons,found.site,found.code)) {
          setVal(statusKey, { ...found, valid: false, used: true });
          if (!isCouponsTab) setVal('couponPct', 0);
          return;
        }

        setVal(statusKey, { ...found, valid: null, testing: true });
        await new Promise(r => setTimeout(r, 400));
        setVal(statusKey, { ...found, valid: true });
        if (!isCouponsTab) setVal('couponPct', hasCouponValue(found.value) ? Number(found.value) : 0);
      };

      const confColor = { alta: '#22c55e', média: '#f5a623', baixa: '#8a9bb0' };
      const [siteMenuOpen, setSiteMenuOpen] = useState(false);
      const siteMenuRef = React.useRef(null);

      useEffect(() => {
        const onPointerDown = (e) => {
          if (siteMenuRef.current && !siteMenuRef.current.contains(e.target)) setSiteMenuOpen(false);
        };
        const onKeyDown = (e) => {
          if (e.key === 'Escape') setSiteMenuOpen(false);
        };
        document.addEventListener('pointerdown', onPointerDown);
        document.addEventListener('keydown', onKeyDown);
        return () => {
          document.removeEventListener('pointerdown', onPointerDown);
          document.removeEventListener('keydown', onKeyDown);
        };
      }, []);

      const selectSite = (value) => {
        setVal(siteKey, value);
        setVal(statusKey, null);
        if (isCouponsTab) {
          setVal('selectedSite', value);
        } else {
          setVal('couponPct', 0);
        }
        setSiteMenuOpen(false);
      };

      return (
        <div className={`card ${isCouponsTab ? 'p-5' : 'p-4'}`}>
          <div className="flex items-center gap-2 mb-4">
            <Ico.Search/>
            <span className="rajdhani font-bold text-base text-white uppercase tracking-wide">
              {isCouponsTab ? 'Consultar Cupom' : 'Aplicar Cupom'}
            </span>
          </div>

          <div className="flex gap-2 flex-wrap">
            <div ref={siteMenuRef} className="relative w-full sm:w-auto">
              <button
                type="button"
                onClick={() => setSiteMenuOpen(v => !v)}
                aria-haspopup="listbox"
                aria-expanded={siteMenuOpen}
                className="w-full sm:w-[170px] h-[38px] bg-[#080d12] border rounded-lg px-3 text-sm text-left flex items-center justify-between gap-2 transition-all focus:outline-none"
                style={{
                  borderColor: siteMenuOpen ? '#ff4655' : '#1e2d3d',
                  boxShadow: siteMenuOpen ? '0 0 0 2px rgba(255,70,85,0.08)' : 'none',
                  color: site ? '#e8eaed' : '#8a9bb0'
                }}
              >
                <span className="flex items-center gap-2 min-w-0">
                  {site === 'all' ? (
                    <span className="w-2 h-2 rounded-full flex-shrink-0 bg-gray-300"/>
                  ) : site && SITES[site] ? (
                    <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background:SITES[site].color}}/>
                  ) : null}
                  <span className="truncate">{site === 'all' ? 'Todos' : (site && SITES[site] ? SITES[site].label : 'Selecione o site')}</span>
                </span>
                <span className="text-gray-500 flex-shrink-0">{siteMenuOpen ? <Ico.ChevronUp/> : <Ico.ChevronDown/>}</span>
              </button>

              {siteMenuOpen && (
                <div
                  role="listbox"
                  className="absolute left-0 top-full mt-1 w-full sm:w-[190px] overflow-hidden rounded-lg z-[1000] fade-in"
                  style={{background:'#0b1219',border:'1px solid #26384a',boxShadow:'0 12px 30px rgba(0,0,0,0.55)'}}
                >
                  {isCouponsTab && (
                    <button
                      type="button"
                      role="option"
                      aria-selected={site === 'all'}
                      onClick={() => selectSite('all')}
                      className="w-full px-3 py-2.5 text-left text-sm transition-colors flex items-center gap-2"
                      style={{background:site==='all'?'#ff465512':'transparent',color:site==='all'?'#ffffff':'#d1d7df',borderLeft:site==='all'?'2px solid #ff4655':'2px solid transparent'}}
                      onMouseEnter={e => { if(site!=='all') e.currentTarget.style.background='#111b24'; }}
                      onMouseLeave={e => { if(site!=='all') e.currentTarget.style.background='transparent'; }}
                    >
                      <span className="w-2 h-2 rounded-full bg-gray-300 flex-shrink-0"/>
                      <span>Todos</span>
                      {site === 'all' && <span className="ml-auto text-[#ff4655]"><Ico.Check/></span>}
                    </button>
                  )}
                  {!isCouponsTab && (
                    <button
                      type="button"
                      role="option"
                      aria-selected={!site}
                      onClick={() => selectSite('')}
                      className="w-full px-3 py-2.5 text-left text-sm transition-colors flex items-center gap-2"
                      style={{background:!site?'#ff465512':'transparent',color:!site?'#ffffff':'#a8b4c2',borderLeft:!site?'2px solid #ff4655':'2px solid transparent'}}
                      onMouseEnter={e => { if(site) e.currentTarget.style.background='#111b24'; }}
                      onMouseLeave={e => { if(site) e.currentTarget.style.background='transparent'; }}
                    >
                      <span className="w-2 h-2 rounded-full bg-gray-600 flex-shrink-0"/>
                      Selecione o site
                    </button>
                  )}
                  {Object.entries(SITES).map(([k, v]) => {
                    const selected = site === k;
                    return (
                      <button
                        key={k}
                        type="button"
                        role="option"
                        aria-selected={selected}
                        onClick={() => selectSite(k)}
                        className="w-full px-3 py-2.5 text-left text-sm transition-colors flex items-center gap-2"
                        style={{background:selected?'#ff465512':'transparent',color:selected?'#ffffff':'#d1d7df',borderLeft:selected?'2px solid #ff4655':'2px solid transparent'}}
                        onMouseEnter={e => { if(!selected) e.currentTarget.style.background='#111b24'; }}
                        onMouseLeave={e => { if(!selected) e.currentTarget.style.background='transparent'; }}
                      >
                        <span className="w-2 h-2 rounded-full flex-shrink-0" style={{background:v.color}}/>
                        <span>{v.label}</span>
                        {selected && <span className="ml-auto text-[#ff4655]"><Ico.Check/></span>}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
            <input type="text" value={code}
              onChange={e => { setVal(codeKey, e.target.value); setVal(statusKey, null); if(!isCouponsTab) setVal('couponPct',0); }}
              placeholder="Código do cupom" onKeyDown={e => e.key === 'Enter' && handleTest()}
              className="flex-1 min-w-[140px] bg-[#080d12] border border-[#1e2d3d] rounded-lg px-3 py-2 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-[#ff4655]"/>
            <button onClick={handleTest}
              className="px-5 py-2 rounded-lg text-sm font-bold transition-transform active:scale-95 flex-shrink-0"
              style={{background: 'linear-gradient(135deg,#ff4655,#c93040)', color: '#fff'}}>
              Verificar
            </button>
          </div>

          {status && (
            <div className="mt-3 p-3 rounded-lg text-sm flex items-start gap-2 fade-in relative"
                 style={
                   status.testing       ? {background:'#f5a62310',border:'1px solid #f5a62330',color:'#f5a623'} :
                   status.valid===true  ? {background:'#22c55e10',border:'1px solid #22c55e30',color:'#22c55e'} :
                   status.valid===false ? {background:'#ff465510',border:'1px solid #ff455530',color:'#ff8a93'} :
                                          {background:'#f5a62310',border:'1px solid #f5a62330',color:'#f5a623'}
                 }>
              {status.testing      ? <svg className="spin flex-shrink-0 mt-0.5" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
               : status.valid===true  ? <div className="mt-0.5 flex-shrink-0"><Ico.Check/></div>
               : status.valid===false ? <div className="mt-0.5 flex-shrink-0"><Ico.X/></div>
               :                        <div className="mt-0.5 flex-shrink-0"><Ico.Info/></div>}

              <div className="pr-4 flex-1">
                {status.testing ? (
                  <p className="font-bold pulse">Verificando banco de dados...</p>
                ) : status.valid === true ? (
                  <>
                    <p className="font-bold">{status.code} — Encontrado!</p>
                    <div className="text-xs mt-1 opacity-80 flex flex-wrap items-center gap-x-3 gap-y-1">
                      <span>{status.desc}</span>
                      {isCouponsTab && status.site && SITES[status.site] && <span className="text-gray-400">Loja: {SITES[status.site].label}</span>}
                      {status.method && <span className="text-gray-400">{status.method}</span>}
                      {status.source && <span className="text-gray-400">Fonte: {status.source}</span>}
                      <span>Confiança: <strong style={{color: confColor[status.confidence]}}>{status.confidence}</strong></span>
                    </div>

                    {!isCouponsTab && (
                      <div className="mt-3 pt-3 flex items-center gap-3 flex-wrap"
                           style={{borderTop:'1px solid rgba(34,197,94,0.15)'}}>
                        <span className="text-[11px] font-semibold opacity-60 uppercase tracking-wider">
                          {hasCouponValue(status.value) ? 'Desconto aplicado:' : 'Informe o desconto:'}
                        </span>
                        <div className="flex items-center gap-1.5">
                          <input
                            type="number"
                            min="0" max="100" step="1"
                            value={couponPct}
                            onChange={e => {
                              const v = Math.min(100, Math.max(0, Number(e.target.value)));
                              setVal('couponPct', v);
                            }}
                            className="discount-input"
                          />
                          <span className="font-bold text-sm" style={{color:'#22c55e'}}>% OFF</span>
                          <span className="text-[10px] opacity-40 flex items-center gap-0.5 ml-1">
                            <Ico.Edit/> editável
                          </span>
                        </div>
                        {hasCouponValue(status.value) && couponPct !== Number(status.value) && (
                          <button
                            onClick={() => setVal('couponPct', Number(status.value))}
                            className="text-[10px] px-2 py-0.5 rounded-full font-bold transition-all hover:opacity-80"
                            style={{background:'#22c55e18',border:'1px solid #22c55e40',color:'#22c55e'}}
                          >
                            ↺ Restaurar ({status.value}%)
                          </button>
                        )}
                        {!hasCouponValue(status.value) && (
                          <span className="text-[10px] text-gray-500">A fonte encontrou o código, mas não informou a porcentagem.</span>
                        )}
                      </div>
                    )}

                    {isCouponsTab && (
                      <p className="mt-1 font-bold text-sm" style={{color:'#22c55e'}}>
                        {hasCouponValue(status.value) ? `${status.value}% OFF${status.applied ? ' aplicado' : ''}` : 'Desconto não informado pela fonte'}
                      </p>
                    )}
                  </>
                ) : status.valid === false ? (
                  <>
                    <p className="font-bold">{status.code} — {status.used ? 'Cupom já usado' : 'Não encontrado na base atual'}</p>
                    <p className="text-xs mt-0.5 opacity-80">
                      {status.used
                        ? 'Este cupom está marcado como usado e não pode ser aplicado novamente.'
                        : site === 'all'
                          ? 'O código não foi encontrado em nenhuma das lojas rastreadas.'
                          : <>Pode ser um cupom não mapeado no nosso sistema. Tente testar diretamente no site do {SITES[site]?.label}.</>}
                    </p>

                ) : null}

              {!status.testing && !isCouponsTab && (
                <button
                  onClick={() => { setVal('couponPct', 0); setVal(codeKey, ''); setVal(statusKey, null); }}
                  className="absolute right-3 top-3 opacity-50 hover:opacity-100">
                  <Ico.X/>
                </button>
              )}
            </div>
          )}
        </div>
      );

    function CouponSelectionPanel({moduleKey,state,dispatch,knownCoupons,usedCoupons,toggleCouponUsed}){
      const localState=state[moduleKey];
      const selectedCoupons=localState.selectedCoupons||{};
      const couponOverrides=localState.couponOverrides||{};
      const setVal=(f,v)=>dispatch({type:moduleKey.toUpperCase(),field:f,val:v});
      const [siteFilter,setSiteFilter]=useState('all');
      const siteOrder=['official','nuuvem','rdc','bonoxs','aurora'];
      const allCoupons=Object.entries(knownCoupons).flatMap(([site,cs])=>(cs||[]).map(c=>({...c,site})));
      const filtered=allCoupons
        .filter(c=>siteFilter==='all'||c.site===siteFilter)
        .sort((a,b)=>{
          if(a.site!==b.site) return siteOrder.indexOf(a.site)-siteOrder.indexOf(b.site);
          return Number(b.value||0)-Number(a.value||0);
        });
      const storeFilters=[['all','Todos'],...siteOrder.filter(k=>(knownCoupons[k]||[]).length>0).map(k=>[k,SITES[k].tag])];
      const close=()=>setVal('showCouponSelector',false);
      useEffect(()=>{
        const onKey=e=>{if(e.key==='Escape')close();};
        window.addEventListener('keydown',onKey);
        return()=>window.removeEventListener('keydown',onKey);
      },[]);
      const toggleConsider=(site,code)=>{
        const key=couponKey(site,code);
        const next={...(selectedCoupons||{})};
        if(next[key]) delete next[key]; else next[key]=true;
        setVal('selectedCoupons',next);
      };
      const selectAllFromSite=(site)=>{
        const next={...(selectedCoupons||{})};
        allCoupons.forEach(c=>{
          if((site==='all'||c.site===site) && !isCouponUsed(usedCoupons,c.site,c.code)) next[couponKey(c.site,c.code)]=true;
        });
        setVal('selectedCoupons',next);
      };
      const clearFiltered=()=>{
        const next={...(selectedCoupons||{})};
        allCoupons.forEach(c=>{if(siteFilter==='all'||c.site===siteFilter) delete next[couponKey(c.site,c.code)];});
        setVal('selectedCoupons',next);
      };
      const chooseFilter=(site)=>{
        setSiteFilter(site);
        selectAllFromSite(site);
      };
      const handleUsed=(site,code)=>{
        const key=couponKey(site,code);
        const wasUsed=(usedCoupons||[]).includes(key);
        const next={...(selectedCoupons||{})};
        const nextOverrides={...(couponOverrides||{})};
        if(!wasUsed){
          delete next[key];
          delete nextOverrides[key];
        }
        setVal('selectedCoupons',next);
        setVal('couponOverrides',nextOverrides);
        toggleCouponUsed(site,code);
      };
      const setOverride=(site,code,value)=>{
        const key=couponKey(site,code);
        const next={...(couponOverrides||{})};
        const numeric=Math.min(100,Math.max(0,Number(value)||0));
        if(numeric>0) next[key]=numeric; else delete next[key];
        setVal('couponOverrides',next);
      };
      const visibleAvailable=filtered.filter(c=>!isCouponUsed(usedCoupons,c.site,c.code)).length;
      const selectedVisible=filtered.filter(c=>!isCouponUsed(usedCoupons,c.site,c.code)&&isCouponSelected(selectedCoupons,c.site,c.code)).length;
      return ReactDOM.createPortal(
        <div className="coupon-submenu-overlay" onMouseDown={e=>{if(e.target===e.currentTarget)close();}}>
          <div className="coupon-submenu-card fade-in" role="dialog" aria-modal="true" aria-label="Selecionar cupons para considerar">
            <div className="coupon-submenu-head">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <p className="rajdhani font-bold text-base uppercase tracking-wider text-white">Selecionar cupons para considerar</p>
                  <p className="text-xs text-gray-500 mt-0.5">Escolha a loja e os cupons que podem entrar no cálculo. Ao clicar em uma loja, todos os cupons disponíveis dela são marcados.</p>
                </div>
                <button onClick={close} className="w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:text-white hover:bg-[#182633] transition-colors" aria-label="Fechar"><Ico.X/></button>
              </div>
              <div className="coupon-store-filter mt-4">
                {storeFilters.map(([k,l])=>(
                  <button key={k} onClick={()=>chooseFilter(k)}
                    className={`text-xs px-3 py-1.5 rounded-full font-bold transition-all rajdhani ${siteFilter===k?'tab-active':'tab-inactive'}`}>
                    {l}
                  </button>
                ))}
              </div>
              <div className="mt-3 flex items-center justify-between gap-3 flex-wrap">
                <div className="coupon-submenu-note px-3 py-2 text-xs text-gray-400">
                  {selectedVisible} de {visibleAvailable} cupom(ns) disponível(is) selecionado(s) neste filtro.
                </div>
                <div className="flex gap-2">
                  <button onClick={()=>selectAllFromSite(siteFilter)} className="text-xs px-2.5 py-1.5 rounded-full font-bold transition-all rajdhani tab-inactive hover:!text-white">Marcar todos</button>
                  <button onClick={clearFiltered} className="text-xs px-2.5 py-1.5 rounded-full font-bold transition-all rajdhani tab-inactive hover:!text-white">Desmarcar</button>
                </div>
              </div>
            </div>
            <div className="coupon-submenu-list">
              {filtered.length===0?(
                <p className="text-gray-600 text-sm py-6 text-center">Nenhum cupom encontrado nesta loja.</p>
              ):filtered.map((c,i)=>{
                const used=isCouponUsed(usedCoupons,c.site,c.code);
                const checked=isCouponSelected(selectedCoupons,c.site,c.code) && !used;
                return(
                  <div key={`${moduleKey}-${c.site}-${c.code}-${i}`} className={`coupon-submenu-row ${used?'coupon-row-used':''}`}>
                    <div className="coupon-store-cell">
                      <span className="site-pill" style={{background:SITES[c.site]?.color+'18',color:SITES[c.site]?.color,border:`1px solid ${SITES[c.site]?.color}35`}}>{SITES[c.site]?.tag}</span>
                    </div>
                    <div className="coupon-main-block coupon-strike">
                      <div className="coupon-meta-line">
                        <code className="coupon-code-pill text-sm font-bold text-white tracking-wider bg-[#080d12] px-2 py-0.5 rounded border border-[#1e2d3d]">{c.code}</code>
                        {hasCouponValue(c.value)&&Number(c.value)>0 ? (
                          <span className="text-sm font-bold" style={{color:'#1bcfa0'}}>{`−${c.value}%`}</span>
                        ) : (
                          <div className="flex items-center gap-1.5">
                            <span className="text-sm font-bold" style={{color:'#1bcfa0'}}>Desconto a verificar</span>
                            <input type="number" min="0" max="100" step="1"
                              value={couponOverrides[couponKey(c.site,c.code)]||''}
                              onChange={e=>setOverride(c.site,c.code,e.target.value)}
                              placeholder="%" className="discount-input" />
                            <span className="text-[10px] text-gray-500">% OFF</span>
                          </div>
                        )}
                      </div>
                      <div className="text-xs text-gray-500 mt-1 line-clamp-2">{c.desc}{c.source&&<span className="ml-2">Fonte: {c.source}</span>}</div>
                    </div>
                    <div className="coupon-source-cell">
                      {c.sourceUrl ? (
                        <a href={c.sourceUrl} target="_blank" rel="noreferrer" className="coupon-source-link" title={`Abrir fonte do cupom em ${c.source || 'site original'}`} aria-label={`Abrir fonte do cupom ${c.code}`}>
                          <Ico.External/>
                        </a>
                      ) : <span className="w-7 h-7" aria-hidden="true" />}
                    </div>
                    <div className="coupon-filter-actions">
                      <CouponCheck checked={checked} disabled={used} onChange={()=>toggleConsider(c.site,c.code)} label="Considerar"/>
                      <CouponCheck checked={used} onChange={()=>handleUsed(c.site,c.code)} label="Usado"/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>,
        document.body
      );
    }

    /* ═══ COMPONENTE COMPARTILHADO: BASE DE CUPONS ════════════ */
    function KnownCouponsCard({state, dispatch, knownCoupons, usedCoupons, toggleCouponUsed, defaultOpen = true}) {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      const {selectedSite,usageFilter}=state.coupons;
      const setQ=(f,v)=>dispatch({type:'COUPONS',field:f,val:v});
      const selectFilterSite=(site)=>{
        setQ('selectedSite',site);
        setQ('testSite',site);
        setQ('testResult',null);
      };

      const confColor={alta:'#22c55e',média:'#f5a623',baixa:'#8a9bb0'};
      const allCoupons=Object.entries(knownCoupons).flatMap(([site,cs])=>cs.map(c=>({...c,site})));
      const filtered=allCoupons.filter(c=>{
        const siteOk=selectedSite==='all'||c.site===selectedSite;
        const used=isCouponUsed(usedCoupons,c.site,c.code);
        const usageOk=usageFilter==='all'||(usageFilter==='used'&&used)||(usageFilter==='unused'&&!used);
        return siteOk&&usageOk;
      });

      return (
        <div className="card p-5">
          <div className="flex items-center justify-between flex-wrap gap-3">
            <div className="flex items-center gap-2 cursor-pointer select-none group" onClick={() => setIsOpen(!isOpen)}>
              <Ico.Sparkle/>
              <span className="rajdhani font-bold text-base text-white uppercase tracking-wide group-hover:text-[#ff4655] transition-colors">Cupons Conhecidos</span>
              <span className="text-gray-500 ml-1">{isOpen ? <Ico.ChevronUp/> : <Ico.ChevronDown/>}</span>
            </div>

            {isOpen && (
              <div className="flex gap-1 flex-wrap fade-in">
                {[['all','Todos'],...Object.entries(SITES).map(([k,v])=>[k,v.tag])].map(([k,l])=>(
                  <button key={k} onClick={()=>selectFilterSite(k)}
                    className={`text-xs px-2.5 py-1 rounded-full font-bold transition-all rajdhani ${selectedSite===k?'tab-active':'tab-inactive'}`}>
                    {l}
                  </button>
                ))}
              </div>
            )}
          </div>

          {isOpen && (
            <>
              <div className="mt-3 pt-3 flex items-center gap-2 flex-wrap" style={{borderTop:'1px solid #1e2d3d'}}>
                <span className="text-[10px] uppercase tracking-widest font-bold text-gray-600 mr-1">Status</span>
                {[['all','Todos'],['unused','Não usados'],['used','Usados']].map(([k,l])=>(
                  <button key={k} onClick={()=>setQ('usageFilter',k)}
                    className={`text-xs px-2.5 py-1 rounded-full font-bold transition-all rajdhani ${usageFilter===k?'tab-active':'tab-inactive'}`}>
                    {l}
                  </button>
                ))}
              </div>

              <div className="divide-y divide-[#1e2d3d] mt-3 fade-in">
                {filtered.length===0?(
                  <p className="text-gray-600 text-sm py-4 text-center">Nenhum cupom encontrado com esses filtros.</p>
                ):filtered.map((c,i)=>{
                  const used=isCouponUsed(usedCoupons,c.site,c.code);
                  return (
                    <div key={`${c.site}-${c.code}-${i}`} className={`coupon-row coupon-known-row ${used?'coupon-row-used':''}`}>
                      <div className="coupon-store-cell">
                        <span className="site-pill" style={{background:SITES[c.site]?.color+'18',color:SITES[c.site]?.color,border:`1px solid ${SITES[c.site]?.color}35`}}>{SITES[c.site]?.tag}</span>
                      </div>
                      <div className="coupon-main-block coupon-strike">
                        <div className="flex items-center gap-2 flex-wrap">
                          <code className="text-sm font-bold text-white tracking-wider bg-[#080d12] px-2 py-0.5 rounded border border-[#1e2d3d] transition-colors"
                                onClick={() => {
                                  if(used){ alert('Este cupom está marcado como usado.'); return; }
                                  navigator.clipboard.writeText(c.code); alert(`Cupom ${c.code} copiado!`);
                                }}
                                style={{cursor:used?'not-allowed':'copy'}} title={used?'Cupom já usado':'Clique para copiar'}>{c.code}</code>
                          <span className="text-sm font-bold" style={{color:'#1bcfa0'}}>{hasCouponValue(c.value) ? `−${c.value}%` : 'Desconto a verificar'}</span>
                        </div>
                        <div className="text-xs text-gray-500 mt-1 flex flex-wrap gap-x-3 gap-y-0.5"><span>{c.desc}</span>{c.method&&<span>{c.method}</span>}{c.source&&<span>Fonte: {c.source}</span>}</div>
                      </div>
                      <div className="coupon-known-actions">
                        <CouponCheck checked={used} onChange={()=>toggleCouponUsed(c.site,c.code)} label="Usado"/>
                        <div className="flex items-center gap-1 text-xs" style={{color:confColor[c.confidence]}}>
                          <span className="w-1.5 h-1.5 rounded-full inline-block" style={{background:confColor[c.confidence]}}/>
                          Confiança {c.confidence}
                        </div>
                        {c.sourceUrl ? (
                          <a href={c.sourceUrl} target="_blank" rel="noreferrer" className="coupon-source-link" title={`Abrir fonte do cupom em ${c.source || 'site original'}`} aria-label={`Abrir fonte do cupom ${c.code}`}>
                            <Ico.External/>
                          </a>
                        ) : <span className="w-7 h-7" aria-hidden="true" />}
                      </div>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </div>
      );
    }

    /* ═══ ABA: CALCULAR VP ════════════════════════════════════ */
    function TabCalculator({state,dispatch,rdcStore,auroraStore,useCashback,setUseCashback,knownCoupons,usedCoupons,toggleCouponUsed}){
      const {currentVP,targetVP,useTicket,couponSite,couponPct,considerCoupons,showCouponSelector}=state.calc;
      const setC=(f,v)=>dispatch({type:'CALC',field:f,val:v});
      const [inputOverlay,setInputOverlay]=useState(false);
      const [mobileEditing,setMobileEditing]=useState(false);
      const resultsRef=React.useRef(null);
      const inputCardRef=React.useRef(null);
      const isMobile=()=>window.matchMedia('(max-width: 767px)').matches;
      const scrollToStores=()=>{
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
          resultsRef.current?.scrollIntoView({behavior:'smooth',block:'start'});
        }));
      };
      const handleInputFocus=()=>{
        if(isMobile()) setMobileEditing(true);
      };
      const handleInputBlur=()=>{
        if(!isMobile()) return;
        setTimeout(()=>{
          if(inputCardRef.current?.contains(document.activeElement)) return;
          setMobileEditing(false);
          if((parseInt(targetVP)||0)>0){
            setInputOverlay(true);
            setTimeout(scrollToStores,180);
          }
        },120);
      };

      const results=useMemo(()=>{
        const curr=parseInt(currentVP)||0,targ=parseInt(targetVP)||0;
        if(targ<=0||curr>=targ)return null;
        let missing=targ-curr;
        if(useTicket)missing=Math.max(0,missing-50);
        if(missing<=0)return null;
        const allStores={official:OFFICIAL_STORE,nuuvem:NUUVEM_STORE,rdc:rdcStore,bonoxs:BONOXS_STORE,aurora:auroraStore};
        const sites={};
        const appliedCoupons={};
        for(const[k,s]of Object.entries(allStores)){
          if(!s||!s.length)continue;
          const supportsCashback=k==='rdc'||k==='aurora';
          const manualCodeRaw=couponSite===k?state.calc.couponCode.trim().toUpperCase():'';
          const manualIsUsed=manualCodeRaw&&isCouponUsed(usedCoupons,k,manualCodeRaw);
          const manualPct=couponSite===k&&!manualIsUsed?Number(couponPct||0):0;
          const manualCode=manualPct>0?manualCodeRaw:'';
          const autoCoupon=considerCoupons?getBestSelectedCoupon(knownCoupons,k,usedCoupons,state.calc.selectedCoupons,state.calc.couponOverrides):null;
          let effectivePct=manualPct;
          let effectiveCode=manualCode;
          if(autoCoupon&&Number(autoCoupon.value)>effectivePct){
            effectivePct=Number(autoCoupon.value);
            effectiveCode=autoCoupon.code;
          }
          appliedCoupons[k]={pct:effectivePct,code:effectiveCode};
          sites[k]=findBestFor(s,missing,supportsCashback&&useCashback,effectivePct);
        }
        return{missing,sites,appliedCoupons};
      },[currentVP,targetVP,useTicket,useCashback,rdcStore,auroraStore,couponPct,couponSite,state.calc.couponCode,considerCoupons,knownCoupons,usedCoupons,state.calc.selectedCoupons,state.calc.couponOverrides]);

      let cheapKey=null,cheapCost=Infinity;
      if(results){for(const[k,v]of Object.entries(results.sites)){if(v&&v.totalCost<cheapCost){cheapCost=v.totalCost;cheapKey=k;}}}
      const hasSuff=parseInt(targetVP)>0&&(parseInt(currentVP)||0)>=(parseInt(targetVP)||0);

      return(
        <div className="space-y-4">
          <div ref={inputCardRef} className={`card p-5 relative overflow-hidden ${inputOverlay&&!mobileEditing?'floating-input-card':''}`}>
            <div className="absolute left-0 top-0 bottom-0 w-0.5" style={{background:'linear-gradient(to bottom,#ff4655,transparent)'}}/>
            {inputOverlay&&!mobileEditing&&(<button type="button" onClick={()=>setInputOverlay(false)}
              className="absolute top-3 right-3 z-20 w-7 h-7 rounded-lg flex items-center justify-center text-gray-500 hover:text-white hover:bg-[#182633] border border-transparent hover:border-[#2a3d4f] transition-all"
              aria-label="Fechar barra sobreposta" title="Fechar"><Ico.X/></button>)}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5"><Ico.Coin/> VP que eu já tenho</label>
                <input type="number" min="0" value={currentVP} onFocus={handleInputFocus} onBlur={handleInputBlur} onChange={e=>setC('currentVP',e.target.value)} placeholder="Opcional. Ex: 250"
                  className="w-full bg-[#080d12] border border-[#1e2d3d] rounded-lg px-4 py-2.5 text-white text-sm focus:outline-none focus:border-[#ff4655] transition-all"/>
              </div>
              <div>
                <label className="flex items-center gap-1.5 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5"><Ico.Target/> VP Alvo (Skin, Passe ou Total)</label>
                <input type="number" min="0" value={targetVP} onFocus={handleInputFocus} onBlur={handleInputBlur} onChange={e=>{const v=e.target.value; setC('targetVP',v); setInputOverlay(v!=='' && Number(v)>0); if(Number(v)>0&&!isMobile()) scrollToStores();}} placeholder="Ex: 1000"

    function TabBudget({state,dispatch,rdcStore,auroraStore,useCashback,knownCoupons,usedCoupons,toggleCouponUsed}){

      const handleInputFocus=()=>{
        if(isMobile()) setMobileEditing(true);

        if(!isMobile()) return;
        setTimeout(()=>{

        const out={};
        const appliedCoupons={};
        const budgetNum = Number(budget) || 0;
        for(const[k,s]of Object.entries(allStores)){
          if(!s||!s.length)continue;
          const supportsCashback=k==='rdc'||k==='aurora';
          const manualCodeRaw=couponSite===k?state.budget.couponCode.trim().toUpperCase():'';
          const manualIsUsed=manualCodeRaw&&isCouponUsed(usedCoupons,k,manualCodeRaw);
          const manualPct=couponSite===k&&!manualIsUsed?Number(couponPct||0):0;
          const manualCode=manualPct>0?manualCodeRaw:'';
          const autoCoupon=considerCoupons?getBestSelectedCoupon(knownCoupons,k,usedCoupons,state.budget.selectedCoupons,state.budget.couponOverrides):null;
          let effectivePct=manualPct;
          let effectiveCode=manualCode;
          if(autoCoupon&&Number(autoCoupon.value)>effectivePct){
            effectivePct=Number(autoCoupon.value);
            effectiveCode=autoCoupon.code;
          }
          appliedCoupons[k]={pct:effectivePct,code:effectiveCode};
          out[k]=findMaxVPFor(s,budgetNum,supportsCashback&&useCashback,effectivePct);
        }
        return {sites:out,appliedCoupons};
      },[budget,rdcStore,auroraStore,useCashback,couponPct,couponSite,state.budget.couponCode,considerCoupons,knownCoupons,usedCoupons,state.budget.selectedCoupons,state.budget.couponOverrides]);

              aria-label="Fechar barra sobreposta" title="Fechar"><Ico.X/></button>)}
            <p className="text-xs text-gray-500 uppercase tracking-widest font-semibold mb-1">Modo Orçamento</p>
            <p className="text-gray-500 text-xs mb-5">Selecione o valor que você quer gastar e o VP Optimizer encontrará o máximo de VP possível por ele em cada loja.</p>
            <div className="flex items-end gap-1 mb-3">
              <span className="rajdhani font-black text-3xl text-gray-400">R$</span>
              <input type="number" min="0" step="1" value={budget}
                onFocus={handleInputFocus} onBlur={handleInputBlur}
                onChange={e=>{const v=e.target.value; setB('budget', v === '' ? '' : Number(v)); setInputOverlay(v!=='' && Number(v)>0); if(Number(v)>0&&!isMobile()) scrollToStores();}}
                className="rajdhani font-black text-5xl text-white bg-transparent border-b-2 border-transparent hover:border-[#1e2d3d] focus:border-[#1bcfa0] focus:outline-none w-40 transition-colors"
                style={{textShadow:'0 0 20px rgba(27,207,160,0.3)'}} />
            </div>
            
            {/* Slider com track unificado nativo sem camadas soltas */}
            <div className="relative py-2 flex items-center">
              <input
                type="range"
                min="0"
                max={MAX}
                step="1"
                value={sliderValue}
                onChange={e => setB('budget', Number(e.target.value))}
                style={{
                  background: `linear-gradient(to right, #ff4655 0%, #c93040 ${sliderPct}%, #1e2d3d ${sliderPct}%, #1e2d3d 100%) no-repeat center / 100% 6px`
                }}
              />
            </div>

            <div className="flex justify-between mt-1.5">
              {[16,32,64,113,160,320].map(v=>(
                <button key={v} onClick={()=>setB('budget',v)}
                  className="text-[10px] px-1 font-medium rounded transition-colors"
                  style={{color:Number(budget)===v?'#ff4655':'#3a5068',background:Number(budget)===v?'#ff465512':'transparent'}}>
                  R${v}
                </button>
              ))}
            </div>
            <div className="mt-4 flex flex-wrap gap-4">
              <Checkbox checked={considerCoupons} onChange={()=>{
                const next=!considerCoupons;
                setB('considerCoupons',next);
                setB('showCouponSelector',next);
                if(next && !Object.keys(state.budget.selectedCoupons||{}).length) setB('selectedCoupons',buildDefaultCouponSelection(knownCoupons,usedCoupons));
              }} label="Considerar cupons"
                tooltip="Abre a seleção de cupons para você escolher quais cupons entram no cálculo. Cupons marcados como usados são ignorados."/>
              {considerCoupons&&<button type="button" onClick={()=>setB('showCouponSelector',true)} className="text-xs px-2.5 py-1 rounded-full font-bold rajdhani tab-inactive hover:!text-white transition-all">Configurar cupons</button>}
            </div>

          {considerCoupons && showCouponSelector && (
